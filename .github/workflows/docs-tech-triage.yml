name: Docs Tech Triage

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest

    steps:
      - name: Triage technical/deployment issue
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const labels = issue.labels.map(l => l.name);
            const isTechIssue = labels.includes('tech/deploy');

            if (!isTechIssue) {
              core.info('Issue does not carry tech/deploy label — skipping tech triage.');
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '🔧 **Technical / deployment issue received.**',
                '',
                'This issue is about the documentation repository itself (CI, builds, deployment, or workflows).',
                '',
                'A maintainer or the `docs-infra` Copilot agent can help debug and propose a fix.',
                '',
                'To request Copilot assistance, comment `@copilot debug-deploy` on this issue.',
              ].join('\n'),
            });
