name: Docs Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GOOGLE_ANALYTICS_PROPERTY_ID: ${{ vars.GOOGLE_ANALYTICS_PROPERTY_ID }}
      DEVELOPER_NAME: ${{ vars.DEVELOPER_NAME }}
      DEVELOPER_URL: ${{ vars.DEVELOPER_URL }}
      SITE_URL: ${{ vars.SITE_URL }}
      CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: git-revision-date-localized needs it for accurate dates
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Generate CNAME from environment
        run: |
          set -euo pipefail

          DOMAIN="${CUSTOM_DOMAIN:-}"
          if [[ -z "$DOMAIN" && -n "${SITE_URL:-}" ]]; then
            DOMAIN="$(printf '%s' "$SITE_URL" | sed -E 's#^https?://##; s#/.*$##')"
          fi

          if [[ -z "$DOMAIN" ]]; then
            echo "CUSTOM_DOMAIN and SITE_URL are both empty; cannot generate CNAME."
            exit 1
          fi

          printf '%s\n' "$DOMAIN" > docs/CNAME
          echo "Generated docs/CNAME for domain: $DOMAIN"

      - name: Deploy docs to GitHub Pages
        run: uv run mkdocs gh-deploy --force
