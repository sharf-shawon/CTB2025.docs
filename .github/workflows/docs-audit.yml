name: Docs Audit

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  audit:
    # Only run when the PR was actually merged
    if: github.event.pull_request.merged == true

    runs-on: ubuntu-latest

    steps:
      - name: Check for audit-complete label
        id: audit_guard
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });

            const alreadyAudited = pr.labels.some(
              l => l.name === 'copilot/audit-complete'
            );
            core.setOutput('already_audited', alreadyAudited ? 'true' : 'false');

            if (alreadyAudited) {
              core.info('PR already has copilot/audit-complete label — skipping audit.');
            }

      - name: Checkout repository
        if: steps.audit_guard.outputs.already_audited == 'false'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analyze merged PR changes
        if: steps.audit_guard.outputs.already_audited == 'false'
        id: analyze
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const prNumber = pr.number;
            const prTitle = pr.title;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: prNumber,
              per_page: 100,
            });

            const changedDocs = files
              .map(f => f.filename)
              .filter(name => name.startsWith('docs/') || name === 'mkdocs.yml');

            const moduleMap = {
              '00-getting-started': 'Getting Started',
              '01-business': 'Business',
              '02-factory': 'Factory',
              '03-trade': 'Trade',
              '04-employee': 'Employee',
              '05-settings-and-admin': 'Settings and Admin',
              '06-reference': 'Reference',
            };

            const touched = new Set();
            for (const file of changedDocs) {
              const match = file.match(/^docs\/user-guide\/([^/]+)\//);
              if (match && moduleMap[match[1]]) touched.add(moduleMap[match[1]]);
            }

            const touchedModules = [...touched].sort();
            const score = changedDocs.length > 0 ? Math.min(100, 75 + touchedModules.length * 5) : 70;
            const scoreLabel = `${score}/100`;

            const changesSummary = changedDocs.length
              ? changedDocs.slice(0, 12).map(f => `- ${f}`).join('\n')
              : '- No docs files were changed.';

            const modulesSummary = touchedModules.length
              ? touchedModules.join(', ')
              : 'No module pages changed';

            const learnings = `| ${new Date().toISOString().slice(0, 10)} | PR #${prNumber}: ${prTitle} | Audited ${changedDocs.length} docs file(s); modules: ${modulesSummary}. | Auto-audit feedback with knowledge sync completed. | Do not merge docs PRs without screenshot path and module alignment. |`;

            core.setOutput('pr_number', String(prNumber));
            core.setOutput('pr_title', prTitle);
            core.setOutput('changed_docs_count', String(changedDocs.length));
            core.setOutput('touched_modules', touchedModules.join(', '));
            core.setOutput('changes_summary', changesSummary);
            core.setOutput('quality_score', scoreLabel);
            core.setOutput('learnings', learnings);

      - name: Update knowledge files from audit
        if: steps.audit_guard.outputs.already_audited == 'false'
        env:
          LEARNINGS_ROW: ${{ steps.analyze.outputs.learnings }}
          PR_NUMBER: ${{ steps.analyze.outputs.pr_number }}
          PR_TITLE: ${{ steps.analyze.outputs.pr_title }}
          CHANGED_DOCS_COUNT: ${{ steps.analyze.outputs.changed_docs_count }}
          TOUCHED_MODULES: ${{ steps.analyze.outputs.touched_modules }}
        run: |
          set -euo pipefail

          LEARNINGS_FILE=".github/knowledge/copilot-learnings.md"
          KNOWLEDGE_FILE=".github/knowledge/ctb-knowledge.md"

          if ! grep -Fq "PR #${PR_NUMBER}:" "$LEARNINGS_FILE"; then
            printf "%s\n" "$LEARNINGS_ROW" >> "$LEARNINGS_FILE"
          fi

          SIGNAL_ROW="| $(date +%F) | PR #${PR_NUMBER} | ${TOUCHED_MODULES:-No module pages changed} | ${CHANGED_DOCS_COUNT} docs file(s) updated in merged PR. |"

          if ! grep -Fq "## Automated Signals" "$KNOWLEDGE_FILE"; then
            printf "\n## Automated Signals\n\n" >> "$KNOWLEDGE_FILE"
            printf "| Date | Source | Modules touched | Signal |\n" >> "$KNOWLEDGE_FILE"
            printf "| ---- | ------ | --------------- | ------ |\n" >> "$KNOWLEDGE_FILE"
          fi

          if ! grep -Fq "| PR #${PR_NUMBER} |" "$KNOWLEDGE_FILE"; then
            printf "%s\n" "$SIGNAL_ROW" >> "$KNOWLEDGE_FILE"
          fi

      - name: Commit and push knowledge updates
        if: steps.audit_guard.outputs.already_audited == 'false'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .github/knowledge/copilot-learnings.md .github/knowledge/ctb-knowledge.md
          if git diff --cached --quiet; then
            echo "No knowledge changes to commit."
            exit 0
          fi

          git commit -m "chore: knowledge sync from docs audit for PR #${{ steps.analyze.outputs.pr_number }}"
          git push

      - name: Publish audit report comment
        if: steps.audit_guard.outputs.already_audited == 'false'
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.analyze.outputs.pr_number }}
          PR_TITLE: ${{ steps.analyze.outputs.pr_title }}
          QUALITY_SCORE: ${{ steps.analyze.outputs.quality_score }}
          CHANGED_DOCS_COUNT: ${{ steps.analyze.outputs.changed_docs_count }}
          TOUCHED_MODULES: ${{ steps.analyze.outputs.touched_modules }}
          CHANGES_SUMMARY: ${{ steps.analyze.outputs.changes_summary }}
          LEARNINGS_ROW: ${{ steps.analyze.outputs.learnings }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const prTitle = process.env.PR_TITLE || 'Unknown';
            const qualityScore = process.env.QUALITY_SCORE || 'N/A';
            const changedDocsCount = process.env.CHANGED_DOCS_COUNT || '0';
            const touchedModules = process.env.TOUCHED_MODULES || 'No module pages changed';
            const changesSummary = process.env.CHANGES_SUMMARY || '- No docs files were changed.';
            const learnings = process.env.LEARNINGS_ROW || 'No learning row generated.';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: [
                '## 🤖 Docs Audit Report',
                '',
                `**PR:** #${prNumber} — ${prTitle}`,
                '',
                `**Quality score:** ${qualityScore}`,
                '',
                `**Docs files changed:** ${changedDocsCount}`,
                '',
                `**Modules touched:** ${touchedModules}`,
                '',
                '**Changed files (sample):**',
                changesSummary,
                '',
                '**Learnings entry:**',
                '```',
                learnings,
                '```',
                '',
                '**Knowledge sync:** Updated `.github/knowledge/copilot-learnings.md` and `.github/knowledge/ctb-knowledge.md`.',
                '',
                '_Audit complete. Label `copilot/audit-complete` has been applied to prevent re-runs._',
              ].join('\n'),
            });

      - name: Apply audit-complete label to PR
        if: steps.audit_guard.outputs.already_audited == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            // Ensure the label exists before applying it
            const labelName = 'copilot/audit-complete';
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: labelName,
              });
            } catch (e) {
              if (e.status !== 404) {
                core.warning(`Unexpected error checking for label "${labelName}": ${e.message}`);
              }
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: labelName,
                color: '0e8a16',
                description: 'Copilot audit has been completed for this PR',
              });
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: [labelName],
            });
