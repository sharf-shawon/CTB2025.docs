name: Docs Style Check

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'docs/**/*.md'
      - 'mkdocs.yml'
      - '.github/STYLE_SPEC.md'
      - 'main.py'

jobs:
  style-check:
    name: Style & Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: git-revision-date-localized needs it for accurate dates
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        # --extra dev installs ruff and any other dev-only tools into the venv
        run: uv sync --extra dev

      # -----------------------------------------------------------------------
      # Pre-commit hooks. Auto-fixing hooks are safe to run here: pre-commit
      # exits non-zero when a hook modifies a file, which is exactly the
      # check-only behaviour CI needs. mdformat in particular MUST run through
      # pre-commit so it picks up mdformat-mkdocs from additional_dependencies.
      # -----------------------------------------------------------------------
      - name: Pre-commit validators
        env:
          # ruff is re-run below with explicit check-only flags for a nicer diff
          SKIP: ruff,ruff-format
        run: uv run pre-commit run --all-files

      # -----------------------------------------------------------------------
      # Ruff — check-only (no --fix), report diff
      # -----------------------------------------------------------------------
      - name: Ruff lint check
        run: uv run ruff check --diff .

      - name: Ruff format check
        run: uv run ruff format --check .

      # -----------------------------------------------------------------------
      # Markdown formatting is checked by the mdformat pre-commit hook above.
      # It is NOT re-run here with a hand-written extension list: omitting
      # mdformat-mkdocs strips the indent from MkDocs admonition bodies and
      # breaks every callout on the site.
      # -----------------------------------------------------------------------

      # -----------------------------------------------------------------------
      # Style spec enforcement — hard failure.
      #
      # Replaces the previous annotation-only prohibited-phrase grep, which
      # never blocked a merge and so never prevented a single violation.
      # style_lint.py covers page structure, heading vocabulary, terminology,
      # voice, admonition syntax, and tags, and fails only on violations that
      # are not already recorded in scripts/style_lint_baseline.json.
      # -----------------------------------------------------------------------
      - name: Docs style spec
        run: |
          uv run python scripts/style_lint.py || (
            echo ''
            echo '::error::New style violations. See .github/STYLE_SPEC.md.'
            exit 1
          )

      - name: Style violation summary
        if: always()
        run: uv run python scripts/style_lint.py --stats --no-baseline

      # -----------------------------------------------------------------------
      # Nav alignment
      # Missing nav entries (no .md file) = hard error
      # Orphan .md files (not in nav) = warning only
      # -----------------------------------------------------------------------
      - name: Nav alignment check
        run: |
          echo "Checking nav alignment..."
          set +e
          OUTPUT=$(uv run python main.py nav-audit 2>&1)
          set -e
          echo "$OUTPUT"

          if echo "$OUTPUT" | grep -q 'Files not referenced in nav'; then
            echo '::warning::Some .md files are not in mkdocs.yml nav. Consider adding or archiving them.'
          fi

          if echo "$OUTPUT" | grep -q 'Nav entries with no matching file'; then
            echo '::error::Nav entry exists in mkdocs.yml with no matching .md file. Run: uv run python main.py nav-sync'
            exit 1
          fi

          echo "Nav alignment check passed."

      # -----------------------------------------------------------------------
      # MkDocs strict build
      # -----------------------------------------------------------------------
      - name: MkDocs strict build
        env:
          GOOGLE_ANALYTICS_PROPERTY_ID: 'CI-PLACEHOLDER'
          DEVELOPER_NAME: 'CI'
          DEVELOPER_URL: 'https://example.com'
          SITE_URL: 'https://example.com'
        run: |
          echo "Running MkDocs strict build..."
          uv run mkdocs build --strict

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: site/
          retention-days: 3
