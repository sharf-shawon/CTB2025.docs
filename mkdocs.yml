site_name: CTB Admin Documentation
site_description: User and administrator documentation for CTB Admin
repo_name: CTB2025.wiki
theme:
  name: material
  logo: assets/images/ctb-logo.svg
  favicon: assets/images/ctb-logo.svg
  palette:
    - scheme: slate
      primary: indigo
      accent: deep purple
  features:
    - navigation.instant
    - navigation.sections
    - content.code.copy

extra_css:
  - stylesheets/ctb-theme.css

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
