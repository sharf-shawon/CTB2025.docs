site_name: CTB Admin Documentation
site_url: !ENV [SITE_URL, "https://docs.ctbinfo.com"]
site_description: User and Administrator documentation for CTB Admin
repo_name: CTB2025.wiki
plugins:
  - glightbox
  - social
  - meta
  - search
  - google-translate

theme:
  name: material
  custom_dir: overrides
  logo: assets/images/ctb-logo.svg
  favicon: assets/images/ctb-logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    # - navigation.instant
    - navigation.sections
    - content.code.copy

extra_css:
  - stylesheets/ctb-theme.css

extra_javascript:
  - javascripts/sw-register.js
extra:
  analytics:
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: >-
            Thanks for your feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: >-
            Thanks for your feedback! Help us improve this page by
            using our <a href="..." target="_blank" rel="noopener">feedback form</a>.
    provider: google
    property: !ENV [GOOGLE_ANALYTICS_PROPERTY_ID, "G-XXXXXXXXXX"]
  alternate:
    # Original Language
    - name: English
      lang: "en"
      link: "%GT_RELATIVE_URL%" # For relative urls back to original language
      # Extra languages
    - name: Bangla
      lang: "bn"
      link: "https://translate.goog/?_x_tr_sl=en&_x_tr_tl=bn&_x_tr_hl=en&_x_tr_pto=wapp"
      # _x_tr_sl = source language
      # _x_tr_tl = translation language
  ctb_footer:
    copyright: "© 2026 CTB Admin Documentation. All rights reserved."
    developer_name: !ENV [DEVELOPER_NAME, "Dhakaiya.Dev"]
    developer_url: !ENV [DEVELOPER_URL, "https://dhakaiya.dev"]

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
watch:
  - docs

exclude_docs: |
  _Footer.md
  _Header.md
  _Sidebar.md

validation:
  unrecognized_links: ignore

