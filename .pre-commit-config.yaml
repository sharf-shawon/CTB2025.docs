repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        args: [--unsafe]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict

  - repo: https://github.com/executablebooks/mdformat
    rev: 0.7.22
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-gfm
          - mdformat-frontmatter
          # Required. Without it mdformat strips the 4-space indent from
          # MkDocs admonition bodies, which silently closes the admonition and
          # renders an empty callout with loose body text beneath it.
          - mdformat-mkdocs

  - repo: local
    hooks:
      - id: style-lint
        name: CTB docs style spec
        description: Enforces .github/STYLE_SPEC.md (structure, headings, terminology, voice)
        entry: python3 scripts/style_lint.py
        language: system
        pass_filenames: false
        files: ^(docs/user-guide/.*\.md|scripts/style_lint.*)$
