[project]
name = "ctb2025-docs"
version = "0.1.0"
description = "Documentation workspace for CTB Admin"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mkdocs>=1.6,<2.0",
    "mkdocs-glightbox>=0.5.2",
    "mkdocs-google-translate>=1.3.1",
    "mkdocs-image-gallery-plugin>=1.3.0",
    "mkdocs-material[imaging]>=9.7.4",
    "mkdocs-redirects>=1.2.2",
    "mkdocs-git-revision-date-localized-plugin>=1.4.7",
    "pre-commit>=4.5.1",
    "ruff>=0.15.5",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4.2.0",
    "ruff>=0.13.0",
    # Keep in sync with .pre-commit-config.yaml. mdformat-mkdocs is required:
    # without it mdformat strips the indent from MkDocs admonition bodies.
    "mdformat>=0.7.22",
    "mdformat-gfm>=0.3.7",
    "mdformat-frontmatter>=2.0.8",
    "mdformat-mkdocs>=4.1.2",
]
